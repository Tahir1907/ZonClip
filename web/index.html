<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0912">
<title>ZonClip Web</title>
<style>
:root{color-scheme:dark;--bg:#0b0912;--panel:#171321;--line:#342d48;--cream:#f6f3ec;--muted:#b4acc9;--gold:#e7c58a;--lav:#c3bbe6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#100d18}
.logo{font-weight:900;letter-spacing:.04em;color:var(--gold);font-size:18px}.tag{color:var(--muted);font-size:12px}
main{padding:14px 18px 18px;max-width:1800px;margin:auto}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:12px;margin-bottom:12px}
input{min-width:220px;flex:1;background:#0e0b16;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--cream);font:inherit}
button,a.link{border:1px solid var(--line);border-radius:8px;background:#29223a;color:var(--cream);padding:10px 14px;font:600 13px inherit;cursor:pointer;text-decoration:none}
button.primary{background:var(--gold);color:#241b0d;border-color:var(--gold);font-weight:800}
#frame{width:100%;height:calc(100vh - 145px);min-height:620px;border:1px solid var(--line);border-radius:12px;background:#100d18}
.notice{color:var(--muted);font-size:12px;margin:0 0 10px}
@media(max-width:650px){header{padding:12px}main{padding:10px}#frame{height:calc(100vh - 190px);min-height:520px}.toolbar input{flex-basis:100%}}
</style>
</head>
<body>
<header><div class="logo">ZONCLIP</div><div class="tag">Hosted dashboard · Local processing</div></header>
<main>
  <div class="toolbar">
    <input id="localUrl" type="url" value="http://127.0.0.1:8765/" aria-label="Local ZonClip address">
    <button class="primary" id="connect">Connect local Studio</button>
    <a class="link" id="openLocal" href="http://127.0.0.1:8765/" target="_blank" rel="noopener">Open locally</a>
  </div>
  <p class="notice">Your video files, AI models, account tokens and rendering stay on your Windows PC. Keep the ZonClip desktop app running. This page only embeds its local Studio; it does not upload videos to Vercel.</p>
  <iframe id="frame" title="ZonClip local Studio" src="about:blank" referrerpolicy="no-referrer"></iframe>
</main>
<script>
"use strict";
const input=document.getElementById("localUrl"),frame=document.getElementById("frame"),openLocal=document.getElementById("openLocal");
function connect(){
  let url;
  try{url=new URL(input.value.trim());}catch(e){alert("Enter a valid local ZonClip URL.");return;}
  if(!["http:","https:"].includes(url.protocol)||!["127.0.0.1","localhost","[::1]"].includes(url.hostname)){
    alert("For safety, the local Studio address must point to this PC (127.0.0.1 or localhost).");return;
  }
  if(!url.port)url.port="8765";
  if(url.pathname==="/")url.pathname="/";
  input.value=url.toString();openLocal.href=url.toString();frame.src=url.toString();
}
document.getElementById("connect").addEventListener("click",connect);
input.addEventListener("keydown",e=>{if(e.key==="Enter")connect();});
connect();
</script>
</body>
</html>
