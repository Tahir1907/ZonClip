name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clipper/requirements.txt
      - name: Install core dependencies
        working-directory: clipper
        run: python -m pip install -r requirements.txt
      - name: Validate PowerShell setup syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "clipper/setup.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }
      - name: Compile Python sources
        run: python -m compileall -q clipper
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Studio JavaScript
        shell: pwsh
        working-directory: clipper
        run: |
          python -c "from pathlib import Path; import re; html=Path('dashboard.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script>(.*?)</script>', html, re.S); assert scripts, 'No dashboard script found'; Path('dashboard.check.js').write_text('\n'.join(scripts), encoding='utf-8')"
          node --check dashboard.check.js
          Remove-Item dashboard.check.js
      - name: Run server safety regression tests
        working-directory: clipper
        run: python -m unittest discover -s tools -p "test_server_safety.py" -v
      - name: Run live-session regression tests
        working-directory: clipper
        run: python -m unittest discover -s tools -p "test_live.py" -v
      - name: Run Instagram OAuth regression tests
        working-directory: clipper
        run: python -m unittest discover -s tools -p "test_instagram_oauth.py" -v
