name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clipper/requirements.txt
      - name: Install core dependencies
        working-directory: clipper
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q clipper
      - name: Run server safety regression tests
        working-directory: clipper
        run: python -m unittest discover -s tools -p "test_server_safety.py" -v
