name: Source pipeline tests

on:
  push:
    branches: [main, feat/youtube-hybrid-foundation]
  pull_request:
    branches: [main]

jobs:
  source-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline source tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*source.py" -v
